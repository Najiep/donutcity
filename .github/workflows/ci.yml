name: Portal CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/production-admin-fivem-status

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: donutcity_portal
          MYSQL_USER: donutcity
          MYSQL_PASSWORD: donutcity-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: MySQL and authentication smoke test
        run: npm run smoke
        env:
          PORT: '3100'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: donutcity
          DB_PASSWORD: donutcity-test-password
          DB_NAME: donutcity_portal
